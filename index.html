<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brew Lab</title><style>*{box-sizing:border-box}body{background:#f5f0e8;color:#403126;font:16px system-ui;margin:auto;max-width:760px;padding:20px}section{background:white;padding:20px;border-radius:16px;margin:16px 0}h1{letter-spacing:4px}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d8cbbd;border-radius:8px;width:100%}button{background:#795438;color:white;margin-top:10px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.7}#clock{font-size:48px;text-align:center}small{color:#78695c}</style><h1>BREW LAB.</h1><small>Personal Coffee Extraction Studio · V1.1</small><section><h2>Recipe Lab</h2><label>원두 이름</label><input id="bean"><label>로스팅</label><select id="roast"><option>Light</option><option>Medium</option><option>Dark</option></select><label>가공 방식 (기록용)</label><select id="process"><option>Washed</option><option>Natural</option><option>Honey</option><option>Anaerobic</option><option>Unknown</option></select><label>그라인더</label><select id="grinder"><option>K-Ultra</option><option>C40 MK4</option><option>Ode Gen 2</option></select><label>드리퍼</label><select id="mode"><option>Switch Hybrid</option><option>Switch Percolation</option><option>Switch Immersion</option><option>Kalita 101</option></select><label>원두량 설정</label><select id="doseMode"><option value="auto">자동 추천</option><option value="manual">직접 입력</option></select><div id="cupBox"><label>완성 커피 목표량 (ml, 근사값)</label><input id="cup" type="number" value="200" min="1" step="1"></div><label>원두량 (10–18g)</label><input id="dose" type="number" value="15" min="10" max="18" step="0.1" readonly><p><small id="doseHint"></small></p><label>목표 맛</label><select id="ratio"><option value="16">Balance</option><option value="17">Clarity</option><option value="15">Body</option></select><button onclick="calculate()">레시피 계산</button><pre id="result"></pre><small>경험칙 기반 초기 레시피이며 최적값으로 검증되지 않았습니다.</small><button onclick="saveBean()">원두 저장</button></section><section><h2>Brew Timer</h2><div id="clock">00:00</div><p id="cue"></p><button onclick="start()">시작 / 재개</button><button onclick="pause()">일시정지</button><button onclick="reset()">초기화</button><button onclick="pause();$('actual').value=seconds()">추출 완료</button></section><section><h2>Bean Library</h2><div id="beans"></div></section><section><h2>Brew Journal</h2><label>실제 추출 시간 (초)</label><input id="actual" type="number"><label>만족도 (0–10)</label><input id="rating" type="number" min="0" max="10" value="7"><label>시음 노트</label><textarea id="notes"></textarea><button onclick="saveBrew()">추출 기록 저장</button><pre id="history"></pre><button onclick="backup()">JSON 백업</button><label>백업 복원 (기존 기록 교체)</label><input type="file" accept="application/json" onchange="restore(this)"></section><section><h2>My Equipment</h2>K-Ultra · C40 MK4 · Ode Gen 2 (stock)<p>Hario Switch 02 · Kalita 101 Plastic</p>BOOKOO Themis Ultra · BRITA<p><small>필터/주전자 미등록 · 블루투스 미지원</small></p></section><script>
const $=x=>document.getElementById(x),keys=['bean','roast','process','grinder','mode','dose','ratio','doseMode','cup'];let r=null,base=0,at=null;function read(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}let beans=read('beans'),logs=read('logs');function store(){try{localStorage.setItem('beans',JSON.stringify(beans));localStorage.setItem('logs',JSON.stringify(logs))}catch{alert('저장 실패')}}function profile(){return Object.fromEntries(keys.map(k=>[k,$(k).value]))}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function recommend(){let auto=$('doseMode').value==='auto',ratio=Number($('ratio').value),cup=Number($('cup').value),loss=2;$('dose').readOnly=auto;$('cupBox').hidden=!auto;if(auto){let raw=cup/(ratio-loss);$('dose').value=Math.min(18,Math.max(10,Math.round(raw*10)/10));$('doseHint').textContent=!(cup>0)?'목표량을 입력하세요':raw<10||raw>18?'현재 지원 범위(10–18g)를 벗어납니다. 목표량을 조정하거나 여러 번 추출하세요.':'자동 추천: 원두 1g당 물 2g 흡수 가정';}else $('doseHint').textContent='직접 입력 모드';return !auto||(cup>0&&cup/(ratio-loss)>=9.95&&cup/(ratio-loss)<=18.05)}function calculate(){if(at!==null)return alert('타이머를 정지하세요');if(!recommend())return alert('목표 커피량을 조정하세요. 현재 원두량 지원 범위는 10–18g입니다.');let p=profile(),d=Number(p.dose);if(!(d>=10&&d<=18))return alert('10–18g 범위로 입력하세요');let w=Math.round(d*Number(p.ratio)),b=Math.round(d*3),h=Math.round(w/2),temp={Light:94,Medium:91,Dark:86}[p.roast],off=p.roast==='Dark'?4:p.roast==='Medium'?2:0,g=p.grinder==='K-Ultra'?((70+off)/10).toFixed(1):p.grinder==='C40 MK4'?`${25+off/2} clicks`:'5';let steps=p.mode==='Switch Immersion'?[[0,'닫힘 · 물 투입',w],[120,'열림 · 배수',w]]:p.mode==='Switch Hybrid'?[[0,'열림 · 블루밍',b],[45,'열림 · 푸어',h],[90,'닫힘 · 푸어',w],[150,'열림 · 배수',w]]:[[0,'블루밍',b],[45,'1차',h],[75,'2차',Math.round(w*.75)],[105,'3차',w]];let text=`${p.bean||'New Bean'}\n${p.grinder}: ${g}\n${p.mode}\n추천 원두량: ${d}g\n총 투입 물량: ${w}g\n예상 완성 커피: 약 ${Math.round(w-2*d)}ml\n비율 1:${p.ratio} · ${temp}°C\n${p.mode==='Switch Percolation'?'밸브 항상 열림\n':''}`;let prev=0;for(let [t,n,v] of steps){text+=`\n${fmt(t)}  ${n}  +${v-prev}g / 누적 ${v}g`;prev=v}text+='\n\n배수가 끝나면 종료. 목표 시간 약 2:30–4:00.';r={p,steps,text};$('result').textContent=text;return true}function seconds(){return Math.floor((base+(at===null?0:Date.now()-at))/1000)}function start(){if(!r&&!calculate())return;if(at===null)at=Date.now()}function pause(){if(at!==null){base+=Date.now()-at;at=null}}function reset(){at=null;base=0}setInterval(()=>{let s=seconds();$('clock').textContent=fmt(s);if(r){let x=r.steps.filter(x=>x[0]<=s).at(-1);$('cue').textContent=x?x[1]+' · 누적 '+x[2]+'g':''}},200);function saveBean(){if(!recommend())return alert('목표량을 확인하세요');let p=profile();if(!p.bean.trim())return alert('원두 이름을 입력하세요');beans.push(p);store();render()}function saveBrew(){if(!r)return alert('레시피를 계산하세요');let a=Number($('actual').value),v=Number($('rating').value);if(!(a>0&&v>=0&&v<=10))return alert('시간과 만족도를 확인하세요');logs.unshift({date:new Date().toLocaleString(),recipe:r.text,actual:a,rating:v,notes:$('notes').value});store();render()}function render(){$('beans').replaceChildren();beans.forEach(p=>{let b=document.createElement('button');b.textContent=p.bean;b.onclick=()=>{if(at!==null)return;keys.forEach(k=>$(k).value=p[k]??(k==='doseMode'?'manual':k==='cup'?'200':$(k).value));calculate()};$('beans').append(b)});$('history').textContent=logs.map(l=>`${l.date}\n${l.recipe}\n실제 ${l.actual}s · ${l.rating}/10\n${l.notes}`).join('\n──────────\n')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({beans,logs})],{type:'application/json'}));a.download='brew-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.beans)||!Array.isArray(x.logs)||!x.beans.every(p=>p&&typeof p.bean==='string')||!x.logs.every(l=>l&&typeof l.recipe==='string'))throw Error();if(confirm('기존 기록을 교체할까요?')){beans=x.beans;logs=x.logs;store();render()}}catch{alert('백업 파일 오류')}el.value=''}['doseMode','cup','ratio','mode'].forEach(k=>$(k).addEventListener('input',()=>{if(at===null)recommend()}));calculate();render();</script></html>
